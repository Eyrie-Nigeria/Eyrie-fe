name: ✨ Feature Request
description: Propose a new feature or enhancement for the Eyrie platform.
title: "[FEAT]: "
labels: ["feature", "high-priority"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request! Please provide as much detail as possible.
  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: "Clearly describe the goal from a user's perspective. (e.g., As a Landlord, I want to... so that...)"
      placeholder: "As a [type of user], I want to [perform some action] so that I can [achieve some goal]."
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: "Provide a checklist of all the conditions that must be met for this feature to be considered complete."
      placeholder: |
        - [ ] Criterion 1: ...
        - [ ] Criterion 2: ...
        - [ ] Criterion 3: ...
    validations:
      required: true
